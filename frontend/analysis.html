<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI财报分析 - TURAQ</title>
    <link rel="stylesheet" href="theme-ui.css">
    <link rel="stylesheet" href="analysis.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航 -->
        <nav class="top-nav">
            <div class="nav-brand">
                <h1>TURAQ</h1>
                <span class="nav-subtitle">AI财报分析工具</span>
            </div>
            <div class="nav-actions">
                <a href="index.html" class="nav-link">返回首页</a>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main class="analysis-container">
            <!-- 上传区域 -->
            <div class="upload-section">
                <h2>上传财报PDF</h2>
                <p style="color: var(--text-secondary); margin-bottom: 20px;">
                    上传上市公司年报或半年报，系统将自动提取财务数据并进行风险分析
                </p>

                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">点击选择文件或拖拽到此处</div>
                    <div class="upload-hint">支持PDF格式，最大50MB</div>
                    <input type="file" id="fileInput" accept=".pdf" style="display: none;">
                </div>

                <div class="company-name-input">
                    <input
                        type="text"
                        id="companyName"
                        placeholder="请输入公司名称（如：贵州茅台）"
                        value=""
                    >
                </div>

                <button class="upload-button" id="uploadButton" disabled>
                    开始分析
                </button>

                <div style="margin-top: 20px;">
                    <button class="upload-button" id="testButton" style="background: #6b7280;">
                        使用测试数据（无需上传）
                    </button>
                </div>
            </div>

            <!-- 加载状态 -->
            <div class="loading" id="loadingArea" style="display: none;">
                <div class="loading-spinner"></div>
                <div>正在分析中，请稍候...</div>
            </div>

            <!-- 结果展示区域 -->
            <div id="resultContainer"></div>
        </main>
    </div>

    <script type="module">
        import { uploadFinancialReport, testAnalysis, renderAnalysisResult } from './analysis.js';

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const companyNameInput = document.getElementById('companyName');
        const uploadButton = document.getElementById('uploadButton');
        const testButton = document.getElementById('testButton');
        const loadingArea = document.getElementById('loadingArea');
        const resultContainer = document.getElementById('resultContainer');

        let selectedFile = null;

        // 点击上传区域
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFileSelect(file);
            }
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                handleFileSelect(file);
            } else {
                alert('请上传PDF文件');
            }
        });

        // 处理文件选择
        function handleFileSelect(file) {
            selectedFile = file;
            uploadArea.querySelector('.upload-text').textContent = `已选择: ${file.name}`;
            uploadButton.disabled = false;
        }

        // 上传分析
        uploadButton.addEventListener('click', async () => {
            if (!selectedFile) {
                alert('请先选择文件');
                return;
            }

            const companyName = companyNameInput.value.trim() || '未知公司';

            try {
                // 显示加载
                loadingArea.style.display = 'block';
                resultContainer.innerHTML = '';

                // 上传并分析
                const result = await uploadFinancialReport(selectedFile, companyName);

                // 隐藏加载
                loadingArea.style.display = 'none';

                // 显示结果
                renderAnalysisResult(result, resultContainer);

                // 滚动到结果
                resultContainer.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                loadingArea.style.display = 'none';
                alert('分析失败: ' + error.message);
                console.error(error);
            }
        });

        // 测试按钮
        testButton.addEventListener('click', async () => {
            try {
                // 显示加载
                loadingArea.style.display = 'block';
                resultContainer.innerHTML = '';

                // 调用测试接口
                const result = await testAnalysis();

                // 隐藏加载
                loadingArea.style.display = 'none';

                // 显示结果
                renderAnalysisResult(result, resultContainer);

                // 滚动到结果
                resultContainer.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                loadingArea.style.display = 'none';
                alert('测试失败: ' + error.message);
                console.error(error);
            }
        });
    </script>
</body>
</html>
