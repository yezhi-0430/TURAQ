[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a-share-risk-agent"
version = "0.1.0"
description = "A-share watchlist risk monitoring and paper-trading research agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "uvicorn[standard]>=0.34,<1.0",
    "httpx>=0.28,<1.0",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "apscheduler>=3.10,<4.0",
    "pypdf>=6.1,<7",
    "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
